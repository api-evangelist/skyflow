aid: skyflow
name: Skyflow
description: >-
  Skyflow is a data privacy vault platform that lets companies isolate,
  protect, and govern sensitive customer data (PII, PCI, PHI) and secrets in
  a zero-trust vault, then use it safely through tokenization, encryption,
  polymorphic de-identification, and fine-grained data governance. Developers
  integrate via the REST Data API and Management API plus first-party SDKs for
  Python, Node.js, Go, Java, JavaScript, React, React Native, Android, and iOS,
  and client-side Skyflow Elements for securely collecting and revealing data.
  Skyflow also ships an MCP Data Protection layer for agentic AI. Backed by
  Insight Partners and Seedcamp.
