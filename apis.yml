apis:
- name: Skyflow Data API
  description: >-
    Insert, retrieve, tokenize/detokenize, query, and manage records and files
    in a Skyflow data privacy vault. Authenticated with a JWT bearer token or
    API key (RFC 6750). Base URLs are per-vault under the skyflowapis.com
    (production) and skyflowapis-preview.com (sandbox) domains.
  humanURL: https://docs.skyflow.com/api/data
  baseURL: https://{vaultID}.vault.skyflowapis.com
  properties:
  - type: APIReference
    url: https://docs.skyflow.com/api/data
  - type: Authentication
    url: https://docs.skyflow.com/docs/fundamentals/api-authentication
- name: Skyflow Management API
  description: >-
    Create and manage vaults, workspaces, service accounts, roles, policies,
    and other account resources. Authenticated with a JWT bearer token.
  humanURL: https://docs.skyflow.com/api/management
  baseURL: https://manage.skyflowapis.com
  properties:
  - type: APIReference
    url: https://docs.skyflow.com/api/management
